name: Live Jiji update (home runner)

on:
  workflow_dispatch:
  schedule:
    # 09:00 Africa/Nairobi (UTC+3, no DST)
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: jiji-live-home-update
  cancel-in-progress: false

jobs:
  collect-and-publish:
    # This label deliberately keeps live Jiji traffic on the owner's home machine.
    runs-on: [self-hosted, windows, jiji-home]
    timeout-minutes: 45
    env:
      JIJI_DATA_DIR: C:\Users\Jackb\Downloads\New folder (2)\data
      JIJI_SCRIPT_DIR: C:\Users\Jackb\Downloads\New folder (2)\scripts
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install collector dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check blake3 duckdb

      - name: Collect newest listings politely
        shell: pwsh
        run: |
          $db = Join-Path $env:JIJI_DATA_DIR 'jiji.db'
          if (-not (Test-Path $db)) { throw "Expected persistent database not found: $db" }
          $script = Join-Path $env:JIJI_SCRIPT_DIR 'jiji_incremental.py'
          $slugs = Join-Path $env:JIJI_SCRIPT_DIR 'category_slugs.txt'
          if (-not (Test-Path $script) -or -not (Test-Path $slugs)) { throw 'Expected local collector scripts are missing.' }
          $ok = $false
          1..3 | ForEach-Object {
            if ($ok) { return }
            Write-Host "Live collection attempt $_ of 3"
            python -u $script --slugs-file $slugs --max-pages 3 --sort new --dmin 3 --dmax 8 --db $db
            if ($LASTEXITCODE -eq 0) { $ok = $true; return }
            if ($_ -lt 3) { Start-Sleep -Seconds (60 * $_) }
          }
          if (-not $ok) { throw 'Collector failed after three attempts; GitHub retains this failed run for manual rerun.' }

      - name: Package rolling data release
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          $stage = Join-Path $env:RUNNER_TEMP 'jiji-release'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Compress-Archive -LiteralPath (Join-Path $env:JIJI_DATA_DIR 'jiji.db') -DestinationPath (Join-Path $stage 'jiji.db.zip') -Force
          Copy-Item (Join-Path $env:JIJI_DATA_DIR "snapshot-$date.parquet") (Join-Path $stage 'jiji-live-latest.parquet') -Force
          Get-FileHash (Join-Path $stage '*') -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring($stage.Length + 1) } |
            Set-Content (Join-Path $stage 'SHA256SUMS')

      - name: Update rolling GitHub Release
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'jiji-release'
          $notes = "Daily home-runner live delta. Generated $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')."
          gh release view live-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create live-latest --repo $env:GITHUB_REPOSITORY --title 'Live dataset (rolling)' --notes $notes --prerelease
          }
          gh release upload live-latest (Join-Path $stage 'jiji.db.zip') (Join-Path $stage 'jiji-live-latest.parquet') (Join-Path $stage 'SHA256SUMS') --clobber --repo $env:GITHUB_REPOSITORY
