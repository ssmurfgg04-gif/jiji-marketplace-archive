name: Live Jiji update (home runner)



on:

  workflow_dispatch:

  schedule:

    # 09:00 Africa/Nairobi (UTC+3, no DST)

    - cron: "0 6 * * *"



permissions:

  contents: write



concurrency:

  group: jiji-live-home-update

  cancel-in-progress: false



jobs:

  collect-and-publish:

    # This label deliberately keeps live Jiji traffic on the owner's home machine.

    runs-on: [self-hosted, windows, jiji-home]

    timeout-minutes: 45

    env:

      JIJI_DATA_DIR: C:\Users\Jackb\Downloads\New folder (2)\data

      JIJI_SCRIPT_DIR: C:\Users\Jackb\Downloads\New folder (2)\scripts

      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Install collector dependencies

        shell: powershell

        run: python -m pip install --disable-pip-version-check blake3 duckdb



      - name: Collect newest listings politely

        shell: powershell

        run: |

          $db = Join-Path $env:JIJI_DATA_DIR 'jiji.db'

                    $script = Join-Path $env:JIJI_SCRIPT_DIR 'jiji_incremental.py'
          
          $slugs = Join-Path $env:JIJI_SCRIPT_DIR 'category_slugs.txt'
          
          # Preflight: name every missing local artifact so the fix is one read away.
          # 2026-10-17 failure: jiji.db missing on the home machine (folder moved or
          # renamed). The DB is NOT in the repo; restore the path on the runner or
          # update JIJI_DATA_DIR / JIJI_SCRIPT_DIR in this workflow to the new location.
          $missing = @()
          
          if (-not (Test-Path $db)) { $missing += "database (not recoverable from CI): $db" }
          
          if (-not (Test-Path $script)) { $missing += "collector script: $script" }
          
          if (-not (Test-Path $slugs)) { $missing += "category slugs: $slugs" }
          
          if ($missing.Count -gt 0) {
          
            Write-Host "::error::Home-runner local files missing. Restore them on the runner, or update JIJI_DATA_DIR / JIJI_SCRIPT_DIR in this workflow to the new location:"
          
            $missing | ForEach-Object { Write-Host "  - $_" }
          
            throw "Local environment incomplete: $($missing.Count) artifact(s) missing (see log above)."
          
          }

          $script = Join-Path $env:JIJI_SCRIPT_DIR 'jiji_incremental.py'

          $slugs = Join-Path $env:JIJI_SCRIPT_DIR 'category_slugs.txt'

          $ok = $false

          1..3 | ForEach-Object {

            if ($ok) { return }

            Write-Host "Live collection attempt $_ of 3"

            python -u $script --slugs-file $slugs --max-pages 3 --sort new --dmin 3 --dmax 8 --db $db

            if ($LASTEXITCODE -eq 0) { $ok = $true; return }

            if ($_ -lt 3) { Start-Sleep -Seconds (60 * $_) }

          }

          if (-not $ok) { throw 'Collector failed after three attempts; GitHub retains this failed run for manual rerun.' }



      - name: Weekly data hygiene
        shell: powershell
        run: |
          # died_at marking (14d stale) + category/region backfill. Cheap, idempotent.
          # Runs weekly: day-of-year mod 7 gates it so daily runs skip in seconds.
          if ((Get-Date -UFormat '%j') % 7 -eq 0) {
            python (Join-Path $env:JIJI_SCRIPT_DIR 'data_quality.py') --days 14
            python (Join-Path $env:JIJI_SCRIPT_DIR 'listing_risk.py')
          } else { Write-Host 'hygiene: not weekly slot, skipped' }
      - name: Mark dead listings and normalize
        shell: powershell
        run: |
          python (Join-Path $env:JIJI_SCRIPT_DIR 'data_quality.py') --days 14

      - name: Package rolling data release

        shell: powershell

        run: |

          $date = Get-Date -Format 'yyyy-MM-dd'

          $stage = Join-Path $env:RUNNER_TEMP 'jiji-release'

          New-Item -ItemType Directory -Force $stage | Out-Null

          # jiji.db may still hold a WAL lock from the collector (2026-10-10 failure:

          # Compress-Archive hit "being used by another process"). Snapshot it via the

          # SQLite backup API into a cold copy, then zip the copy â€” never the live file.

          $live = Join-Path $env:JIJI_DATA_DIR 'jiji.db'

          $cold = Join-Path $stage 'jiji.db'

          $env:JIJI_DB_LIVE = $live

          $env:JIJI_DB_COLD = $cold

          python -c "import os,sqlite3; s=sqlite3.connect(os.environ['JIJI_DB_LIVE']); d=sqlite3.connect(os.environ['JIJI_DB_COLD']); s.backup(d); d.execute('PRAGMA wal_checkpoint(TRUNCATE)'); d.close(); s.close()"

          Compress-Archive -LiteralPath $cold -DestinationPath (Join-Path $stage 'jiji.db.zip') -Force

          Remove-Item -LiteralPath $cold -Force

          Copy-Item (Join-Path $env:JIJI_DATA_DIR "snapshot-$date.parquet") (Join-Path $stage 'jiji-live-latest.parquet') -Force

          Get-FileHash (Join-Path $stage '*') -Algorithm SHA256 |

            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Substring($stage.Length + 1) } |

            Set-Content (Join-Path $stage 'SHA256SUMS')



      - name: Update rolling GitHub Release

        shell: powershell

        run: |

          $stage = Join-Path $env:RUNNER_TEMP 'jiji-release'

          $notes = "Daily home-runner live delta. Generated $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')."

          cmd /c "gh release view live-latest --repo %GITHUB_REPOSITORY% >nul 2>nul"

          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {

            gh release create live-latest --repo $env:GITHUB_REPOSITORY --title 'Live dataset (rolling)' --notes $notes --prerelease

          }

          gh release upload live-latest (Join-Path $stage 'jiji.db.zip') (Join-Path $stage 'jiji-live-latest.parquet') (Join-Path $stage 'SHA256SUMS') --clobber --repo $env:GITHUB_REPOSITORY

